name: IndexNow - production
on:
  push:
    branches: [main]
    paths: ['.github/workflows/indexnow.yml']
  deployment_status:
  workflow_dispatch:
permissions: {}
concurrency:
  group: renovim-indexnow-production
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       (github.event.deployment_status.state == 'success' &&
        (github.event.deployment.production_environment == true ||
         github.event.deployment.environment == 'Production' ||
         github.event.deployment.environment == 'production'))) &&
      (github.ref == 'refs/heads/main' || github.event.deployment.ref == 'main' ||
       github.event.deployment.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore last submitted page fingerprints
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .indexnow-state.json
          key: renovim-indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: renovim-indexnow-v1-
      - name: Submit changed production URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree as ET

          host = "www.renov-im.ch"
          base = "https://" + host
          key = "7383b88c882c4e40be771291915807a1"
          key_url = f"{base}/{key}.txt"
          state = Path(".indexnow-state.json")

          def get(url):
              with urlopen(Request(url, headers={"User-Agent": "Renovim-IndexNow/1.0"}), timeout=20) as res:
                  if res.status != 200 or res.geturl() != url:
                      raise RuntimeError(f"Unexpected HTTP status or redirect: {url}")
                  return res.read().decode("utf-8")

          def valid(url):
              u = urlsplit(url)
              return u.scheme == "https" and u.netloc == host and not u.query and not u.fragment

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
                  self.skip = None
                  self.jsonld = False

              def handle_starttag(self, tag, attrs):
                  if self.skip:
                      return
                  a = dict(attrs)
                  if tag in ("script", "style"):
                      self.skip = tag
                      self.jsonld = tag == "script" and a.get("type") == "application/ld+json"
                      return
                  if tag == "meta" and (a.get("name") in ("description", "robots") or a.get("property", "").startswith("og:")):
                      self.parts.append(("meta", a.get("name") or a.get("property"), a.get("content")))
                  if tag == "link" and a.get("rel") == "canonical":
                      self.parts.append(("canonical", a.get("href")))
                  if tag in ("a", "img", "h1", "h2", "h3"):
                      self.parts.append((tag, a.get("href"), a.get("src"), a.get("alt")))

              def handle_endtag(self, tag):
                  if tag == self.skip:
                      self.skip = None
                      self.jsonld = False

              def handle_data(self, data):
                  if self.skip and not self.jsonld:
                      return
                  s = " ".join(data.split())
                  if s:
                      self.parts.append(s)

          if get(key_url).strip() != key:
              raise RuntimeError("Production IndexNow verification file is invalid.")
          root = ET.fromstring(get(base + "/sitemap.xml"))
          urls = sorted(set(x.text.strip() for x in root.findall("{*}url/{*}loc") if x.text))
          if not urls or len(urls) > 10000 or not all(valid(u) for u in urls):
              raise RuntimeError("Invalid or empty production sitemap.")
          previous = json.loads(state.read_text()) if state.exists() else {}
          if not all(valid(u) for u in previous):
              raise RuntimeError("Invalid cached URLs.")
          current = {}
          for url in urls:
              p = Page()
              p.feed(get(url))
              current[url] = hashlib.sha256(json.dumps(p.parts, ensure_ascii=False).encode()).hexdigest()
          # First run notifies recently SEO-updated pages; future runs submit changes only.
          changed = sorted(u for u in current if current[u] != previous.get(u))
          # Removed sitemap URLs are also eligible for a change notification.
          changed += sorted(set(previous) - set(current))
          if changed:
              body = json.dumps({"host": host, "key": key, "keyLocation": key_url, "urlList": changed}).encode()
              req = Request("https://api.indexnow.org/indexnow", data=body,
                            headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
              with urlopen(req, timeout=30) as res:
                  print(f"IndexNow HTTP {res.status}: {len(changed)} URL(s) submitted.")
                  if res.status not in (200, 202):
                      raise RuntimeError("Unexpected IndexNow response.")
          else:
              print("No indexable page content changed; nothing submitted.")
          state.write_text(json.dumps(current, sort_keys=True))
          PY
